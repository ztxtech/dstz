# pyproject.toml —— 打包与元数据配置。
#
# 发布链路：本地只做 `python -m build` + `twine check` 预检（见 build.sh），
# 正式上传由 GitHub Actions 完成（.github/workflows/publish.yml），
# 通过 PyPI trusted publishing（OIDC）上传，仓库与本地都不保存 PyPI token。

[build-system]
# PEP 639 的 SPDX 许可证表达式需要 setuptools>=77。
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dstz"
version = "0.0.7"
authors = [
    { name = "Tianxiang Zhan", email = "zhantianxianguestc@hotmail.com" },
]
description = "一个轻量、易用的Python证据理论库，专注于Dempster-Shafer理论及其扩展。"
readme = "README.md"
# 3.7 / 3.8 已停止维护；CI 覆盖 3.9–3.13。
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

# 关键词，用于 PyPI 搜索优化。
keywords = [
    "evidence theory",
    "Dempster-Shafer",
    "belief functions",
    "information fusion",
    "uncertainty",
    "reasoning",
    "Deng entropy",
    "random permutation set",
]

# PyPI 分类器，帮助用户发现项目。许可证改用 SPDX 表达式后不再重复声明许可证分类器。
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 运行时依赖。
dependencies = [
    "numpy",
]

# 项目链接，显示在 PyPI 侧边栏。
[project.urls]
Homepage = "https://github.com/ztxtech/dstz"
Repository = "https://github.com/ztxtech/dstz"
Issues = "https://github.com/ztxtech/dstz/issues"
Documentation = "https://dstz.readthedocs.io/"
Releases = "https://github.com/ztxtech/dstz/releases"

# 包发现：只收集 dstz 包，排除 example、docs 等非包目录。
[tool.setuptools.packages.find]
where = ["."]
include = ["dstz*"]

# pytest 只收集 tests/ 目录。
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
